<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4f1" />
    <meta
      name="description"
      content="RIBFORM — a parametric studio for planar architectural forms."
    />
    <title>RIBFORM — Parametric Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        if (!document.getElementById('root').childElementCount) {
          document.getElementById('root').textContent = 'RIBFORM could not start: ' + event.message;
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
